<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>El sonido</title><defs><marker id="ar5b6675" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1400" height="96" fill="#163a5f"/><text x="40" y="58" font-size="38" fill="#ffffff" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="40" dy="0.0">El sonido</tspan></text><text x="1360" y="58" font-size="18" fill="#cfe0f3" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1360" dy="0.0">Física · I° medio · Ondas y sonido</tspan></text><line x1="700" y1="520" x2="580" y2="300" stroke="#5b6675" stroke-width="2.5" stroke-linecap="round"/><line x1="700" y1="520" x2="820" y2="300" stroke="#5b6675" stroke-width="2.5" stroke-linecap="round"/><line x1="700" y1="520" x2="530" y2="520" stroke="#5b6675" stroke-width="2.5" stroke-linecap="round"/><line x1="700" y1="520" x2="870" y2="550" stroke="#5b6675" stroke-width="2.5" stroke-linecap="round"/><line x1="700" y1="520" x2="700" y2="690" stroke="#5b6675" stroke-width="2.5" stroke-linecap="round"/><rect x="60" y="130" width="520" height="200" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="84" y="172" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="84" dy="0.0">¿Qué es?</tspan></text><text x="84" y="210" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="84" dy="0.0">Onda<tspan font-weight="700">mecánica</tspan> y<tspan font-weight="700">longitudinal</tspan>: se propaga como</tspan><tspan x="84" dy="22.1">compresiones y rarefacciones del medio. Necesita un</tspan><tspan x="84" dy="22.1">medio (sólido, líquido o gas):<tspan font-weight="700">no</tspan> <tspan font-weight="700">viaja</tspan> <tspan font-weight="700">en</tspan> <tspan font-weight="700">el</tspan> <tspan font-weight="700">vacío</tspan>.</tspan><tspan x="84" dy="22.1">La producen objetos que vibran (fuentes sonoras).</tspan></text><rect x="820" y="130" width="520" height="260" rx="14" fill="#FFF4E5" stroke="none" stroke-width="1.5"/><text x="844" y="172" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="844" dy="0.0">Características</tspan></text><text x="844" y="210" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="844" dy="0.0"><tspan font-weight="700">Tono</tspan> <tspan font-weight="700">o</tspan> <tspan font-weight="700">altura</tspan> → frecuencia: agudo (alta f) o grave</tspan><tspan x="844" dy="22.1">(baja f).</tspan></text><text x="844" y="264.1" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="844" dy="0.0"><tspan font-weight="700">Intensidad</tspan> → amplitud: fuerte o débil; se mide en</tspan><tspan x="844" dy="22.1">decibeles (dB).</tspan></text><text x="844" y="318.20000000000005" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="844" dy="0.0"><tspan font-weight="700">Timbre</tspan> → forma de la onda (armónicos): distingue un</tspan><tspan x="844" dy="22.1">piano de una guitarra.</tspan></text><rect x="60" y="360" width="470" height="300" rx="14" fill="#E8F6EF" stroke="none" stroke-width="1.5"/><text x="84" y="402" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="84" dy="0.0">Rapidez</tspan></text><text x="84" y="440" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="84" dy="0.0">Depende<tspan font-weight="700">solo</tspan> <tspan font-weight="700">del</tspan> <tspan font-weight="700">medio</tspan>, no de la frecuencia.</tspan><tspan x="84" dy="22.1">En general: sólidos &gt; líquidos &gt; gases, porque</tspan><tspan x="84" dy="22.1">depende de la<tspan font-weight="700">rigidez</tspan> del medio (no basta con</tspan><tspan x="84" dy="22.1">que sea más denso).</tspan></text><text x="84" y="538.3" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="84" dy="0.0">Aire (20 °C): 343 m/s · Agua: 1493 m/s ·</tspan><tspan x="84" dy="22.1">Hierro: 5950 m/s</tspan></text><rect x="870" y="420" width="470" height="260" rx="14" fill="#EFEDFB" stroke="none" stroke-width="1.5"/><text x="894" y="462" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="894" dy="0.0">Rango audible</tspan></text><text x="894" y="500" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="894" dy="0.0">El oído humano percibe de 20 Hz a 20 000 Hz.</tspan></text><text x="894" y="532.0" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="894" dy="0.0"><tspan font-weight="700">Infrasonido:</tspan> menos de 20 Hz (terremotos,</tspan><tspan x="894" dy="22.1">elefantes).</tspan></text><text x="894" y="586.1" font-size="17" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="894" dy="0.0"><tspan font-weight="700">Ultrasonido:</tspan> más de 20 000 Hz (ecografías,</tspan><tspan x="894" dy="22.1">murciélagos, delfines).</tspan></text><rect x="60" y="690" width="1280" height="250" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="84" y="732" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="84" dy="0.0">Fenómenos</tspan></text><circle cx="700" cy="520" r="92" fill="#163a5f" stroke="none" stroke-width="2"/><text x="700" y="532" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="700" dy="0.0">SONIDO</tspan></text><circle cx="92" cy="774" r="8" fill="#378ADD" stroke="none" stroke-width="2"/><text x="110" y="780" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="110" dy="0.0">Reflexión</tspan></text><text x="110" y="804" font-size="15.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="110" dy="0.0">Eco (obstáculo a 17 m o más) y reverberación</tspan><tspan x="110" dy="20.2">(más cerca).</tspan></text><circle cx="512" cy="774" r="8" fill="#378ADD" stroke="none" stroke-width="2"/><text x="530" y="780" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="530" dy="0.0">Refracción</tspan></text><text x="530" y="804" font-size="15.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="530" dy="0.0">Cambia de medio o de temperatura: cambian v y</tspan><tspan x="530" dy="20.2">λ, no f.</tspan></text><circle cx="932" cy="774" r="8" fill="#378ADD" stroke="none" stroke-width="2"/><text x="950" y="780" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="950" dy="0.0">Difracción</tspan></text><text x="950" y="804" font-size="15.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="950" dy="0.0">Rodea obstáculos: se oye detrás de una</tspan><tspan x="950" dy="20.2">esquina.</tspan></text><circle cx="92" cy="856" r="8" fill="#378ADD" stroke="none" stroke-width="2"/><text x="110" y="862" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="110" dy="0.0">Interferencia</tspan></text><text x="110" y="886" font-size="15.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="110" dy="0.0">Refuerzo o silencio; pulsaciones al afinar.</tspan></text><circle cx="512" cy="856" r="8" fill="#378ADD" stroke="none" stroke-width="2"/><text x="530" y="862" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="530" dy="0.0">Resonancia</tspan></text><text x="530" y="886" font-size="15.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="530" dy="0.0">Vibra con su frecuencia natural y la amplitud</tspan><tspan x="530" dy="20.2">crece.</tspan></text><circle cx="932" cy="856" r="8" fill="#378ADD" stroke="none" stroke-width="2"/><text x="950" y="862" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="950" dy="0.0">Efecto Doppler</tspan></text><text x="950" y="886" font-size="15.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="950" dy="0.0">Fuente que se acerca: más agudo; que se aleja:</tspan><tspan x="950" dy="20.2">más grave.</tspan></text><text x="1376" y="984" font-size="13" fill="#5b6675" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1376" dy="0.0">Órbita Matemática · Prof. Fernando J. Aravena Muñoz</tspan></text></svg>