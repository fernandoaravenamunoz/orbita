<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Ondas</title><defs><marker id="ar378ADD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#378ADD"/></marker><marker id="ar16202b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202b"/></marker><marker id="ar5b6675" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="arD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1400" height="96" fill="#163a5f"/><text x="40" y="58" font-size="38" fill="#ffffff" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="40" dy="0.0">Ondas</tspan></text><text x="1360" y="58" font-size="18" fill="#cfe0f3" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1360" dy="0.0">Física · I° medio · Ondas y sonido</tspan></text><rect x="40" y="120" width="640" height="150" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="64" y="160" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">¿Qué es una onda?</tspan></text><text x="64" y="196" font-size="18" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Es una<tspan font-weight="700">perturbación</tspan> <tspan font-weight="700">que</tspan> <tspan font-weight="700">se</tspan> <tspan font-weight="700">propaga</tspan> transportando<tspan font-weight="700">energía</tspan> <tspan font-weight="700">sin</tspan></tspan><tspan x="64" dy="23.4"><tspan font-weight="700">transportar</tspan> <tspan font-weight="700">materia</tspan>. Puede viajar por un medio material o, en</tspan><tspan x="64" dy="23.4">el caso de las ondas electromagnéticas, por el vacío.</tspan></text><rect x="40" y="290" width="640" height="330" rx="14" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/><text x="64" y="330" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Elementos espaciales</tspan></text><line x1="70" y1="470" x2="650" y2="470" stroke="#5b6675" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/><path d="M80.0,470.0 L84.5,461.8 L89.0,453.7 L93.5,445.8 L98.0,438.2 L102.5,431.1 L107.0,424.5 L111.5,418.6 L116.0,413.4 L120.5,408.9 L125.0,405.3 L129.5,402.6 L134.0,400.9 L138.5,400.1 L143.0,400.2 L147.5,401.3 L152.0,403.4 L156.5,406.4 L161.0,410.3 L165.5,415.0 L170.0,420.5 L174.5,426.7 L179.0,433.4 L183.5,440.7 L188.0,448.4 L192.5,456.3 L197.0,464.5 L201.5,472.7 L206.0,481.0 L210.5,489.0 L215.0,496.8 L219.5,504.2 L224.0,511.1 L228.5,517.5 L233.0,523.2 L237.5,528.2 L242.0,532.4 L246.5,535.7 L251.0,538.1 L255.5,539.5 L260.0,540.0 L264.5,539.5 L269.0,538.1 L273.5,535.7 L278.0,532.4 L282.5,528.2 L287.0,523.2 L291.5,517.5 L296.0,511.1 L300.5,504.2 L305.0,496.8 L309.5,489.0 L314.0,481.0 L318.5,472.7 L323.0,464.5 L327.5,456.3 L332.0,448.4 L336.5,440.7 L341.0,433.4 L345.5,426.7 L350.0,420.5 L354.5,415.0 L359.0,410.3 L363.5,406.4 L368.0,403.4 L372.5,401.3 L377.0,400.2 L381.5,400.1 L386.0,400.9 L390.5,402.6 L395.0,405.3 L399.5,408.9 L404.0,413.4 L408.5,418.6 L413.0,424.5 L417.5,431.1 L422.0,438.2 L426.5,445.8 L431.0,453.7 L435.5,461.8 L440.0,470.0 L444.5,478.2 L449.0,486.3 L453.5,494.2 L458.0,501.8 L462.5,508.9 L467.0,515.5 L471.5,521.4 L476.0,526.6 L480.5,531.1 L485.0,534.7 L489.5,537.4 L494.0,539.1 L498.5,539.9 L503.0,539.8 L507.5,538.7 L512.0,536.6 L516.5,533.6 L521.0,529.7 L525.5,525.0 L530.0,519.5 L534.5,513.3 L539.0,506.6 L543.5,499.3 L548.0,491.6 L552.5,483.7 L557.0,475.5 L561.5,467.3 L566.0,459.0 L570.5,451.0 L575.0,443.2 L579.5,435.8 L584.0,428.9 L588.5,422.5 L593.0,416.8 L597.5,411.8 L602.0,407.6 L606.5,404.3 L611.0,401.9 L615.5,400.5 L620.0,400.0" stroke="#378ADD" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="140" y1="382" x2="380" y2="382" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="380" y1="382" x2="140" y2="382" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="260" y="372" font-size="17" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="260" dy="0.0">λ longitud de onda</tspan></text><line x1="140" y1="400" x2="140" y2="392" stroke="#5b6675" stroke-width="1" stroke-linecap="round"/><line x1="380" y1="400" x2="380" y2="392" stroke="#5b6675" stroke-width="1" stroke-linecap="round"/><line x1="660" y1="470" x2="660" y2="540" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arD85A30)" stroke-linecap="round"/><line x1="560" y1="540" x2="664" y2="540" stroke="#5b6675" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="652" y="568" font-size="17" fill="#D85A30" text-anchor="end" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="652" dy="0.0">A amplitud</tspan></text><text x="140" y="412" font-size="16" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="140" dy="0.0">cresta</tspan></text><text x="260" y="572" font-size="16" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="260" dy="0.0">valle</tspan></text><text x="64" y="604" font-size="15" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Línea punteada: posición de equilibrio del medio.</tspan></text><rect x="40" y="640" width="640" height="330" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="64" y="680" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Elementos temporales</tspan></text><text x="64" y="720" font-size="18" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0"><tspan font-weight="700">Periodo</tspan> <tspan font-weight="700">(T):</tspan> tiempo de una oscilación completa. Unidad:</tspan><tspan x="64" dy="23.4">segundo (s).</tspan></text><text x="64" y="770" font-size="18" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0"><tspan font-weight="700">Frecuencia</tspan> <tspan font-weight="700">(f):</tspan> oscilaciones por segundo. Unidad: hertz (Hz =</tspan><tspan x="64" dy="23.4">1/s).</tspan></text><text x="250" y="836" font-size="26" fill="#D85A30" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="250" dy="0.0">f = 1 / T</tspan></text><text x="470" y="836" font-size="26" fill="#D85A30" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="470" dy="0.0">T = 1 / f</tspan></text><text x="64" y="880" font-size="18" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0"><tspan font-weight="700">Rapidez</tspan> <tspan font-weight="700">de</tspan> <tspan font-weight="700">propagación:</tspan> depende del medio.</tspan></text><text x="360" y="940" font-size="28" fill="#D85A30" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="360" dy="0.0">v = λ · f = λ / T</tspan></text><rect x="720" y="120" width="640" height="430" rx="14" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/><text x="744" y="160" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Tipos de ondas</tspan></text><text x="744" y="205" font-size="17" fill="#5b6675" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Según el medio</tspan></text><rect x="744" y="215" width="290" height="38" rx="8" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="889" y="240" font-size="15.5" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="889" dy="0.0">Mecánicas (sonido, olas)</tspan></text><rect x="1046" y="215" width="290" height="38" rx="8" fill="#FBE3D7" stroke="none" stroke-width="1.5"/><text x="1191" y="240" font-size="15.5" fill="#8A3B2E" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1191" dy="0.0">Electromagnéticas (luz, radio)</tspan></text><text x="744" y="273" font-size="17" fill="#5b6675" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Según la dirección de vibración</tspan></text><rect x="744" y="283" width="290" height="38" rx="8" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="889" y="308" font-size="15.5" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="889" dy="0.0">Transversales (cuerda, luz)</tspan></text><rect x="1046" y="283" width="290" height="38" rx="8" fill="#FBE3D7" stroke="none" stroke-width="1.5"/><text x="1191" y="308" font-size="15.5" fill="#8A3B2E" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1191" dy="0.0">Longitudinales (sonido, resorte)</tspan></text><text x="744" y="341" font-size="17" fill="#5b6675" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Según las dimensiones</tspan></text><rect x="744" y="351" width="290" height="38" rx="8" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="889" y="376" font-size="15.5" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="889" dy="0.0">1D (cuerda) · 2D (agua)</tspan></text><rect x="1046" y="351" width="290" height="38" rx="8" fill="#FBE3D7" stroke="none" stroke-width="1.5"/><text x="1191" y="376" font-size="15.5" fill="#8A3B2E" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1191" dy="0.0">3D (sonido, luz)</tspan></text><text x="744" y="409" font-size="17" fill="#5b6675" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Según cuántas oscilaciones</tspan></text><rect x="744" y="419" width="290" height="38" rx="8" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="889" y="444" font-size="15.5" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="889" dy="0.0">Pulso (una sola)</tspan></text><rect x="1046" y="419" width="290" height="38" rx="8" fill="#FBE3D7" stroke="none" stroke-width="1.5"/><text x="1191" y="444" font-size="15.5" fill="#8A3B2E" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1191" dy="0.0">Periódicas (repetidas)</tspan></text><text x="744" y="477" font-size="17" fill="#5b6675" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Según su desplazamiento</tspan></text><rect x="744" y="487" width="290" height="38" rx="8" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="889" y="512" font-size="15.5" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="889" dy="0.0">Viajeras (avanzan)</tspan></text><rect x="1046" y="487" width="290" height="38" rx="8" fill="#FBE3D7" stroke="none" stroke-width="1.5"/><text x="1191" y="512" font-size="15.5" fill="#8A3B2E" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1191" dy="0.0">Estacionarias (nodos fijos)</tspan></text><rect x="720" y="570" width="640" height="400" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="744" y="610" font-size="24" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="744" dy="0.0">Fenómenos ondulatorios</tspan></text><circle cx="760" cy="649" r="18" fill="#ffffff" stroke="#378ADD" stroke-width="2.5"/><text x="760" y="655" font-size="17" fill="#378ADD" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="760" dy="0.0">1</tspan></text><text x="792" y="649" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Reflexión</tspan></text><text x="792" y="673" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">La onda choca con un obstáculo y vuelve. θi = θr.</tspan></text><circle cx="760" cy="711" r="18" fill="#ffffff" stroke="#378ADD" stroke-width="2.5"/><text x="760" y="717" font-size="17" fill="#378ADD" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="760" dy="0.0">2</tspan></text><text x="792" y="711" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Refracción</tspan></text><text x="792" y="735" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Cambia de medio: cambian v y λ, pero no f.</tspan></text><circle cx="760" cy="773" r="18" fill="#ffffff" stroke="#378ADD" stroke-width="2.5"/><text x="760" y="779" font-size="17" fill="#378ADD" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="760" dy="0.0">3</tspan></text><text x="792" y="773" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Difracción</tspan></text><text x="792" y="797" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Rodea obstáculos o se abre al pasar por una abertura.</tspan></text><circle cx="760" cy="835" r="18" fill="#ffffff" stroke="#378ADD" stroke-width="2.5"/><text x="760" y="841" font-size="17" fill="#378ADD" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="760" dy="0.0">4</tspan></text><text x="792" y="835" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Interferencia</tspan></text><text x="792" y="859" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Dos ondas se superponen: se refuerzan o se anulan.</tspan></text><circle cx="760" cy="897" r="18" fill="#ffffff" stroke="#378ADD" stroke-width="2.5"/><text x="760" y="903" font-size="17" fill="#378ADD" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="760" dy="0.0">5</tspan></text><text x="792" y="897" font-size="19" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">Absorción</tspan></text><text x="792" y="921" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="792" dy="0.0">El medio toma parte de su energía: la amplitud disminuye.</tspan></text><text x="1376" y="994" font-size="13" fill="#5b6675" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1376" dy="0.0">Órbita Matemática · Prof. Fernando J. Aravena Muñoz</tspan></text></svg>