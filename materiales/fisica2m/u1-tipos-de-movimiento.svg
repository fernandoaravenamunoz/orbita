<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Tipos de movimiento rectilíneo</title><defs><marker id="ar163a5f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#163a5f"/></marker><marker id="ar16202b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202b"/></marker><marker id="ar7F77DD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1400" height="96" fill="#163a5f"/><text x="40" y="58" font-size="38" fill="#ffffff" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="40" dy="0.0">Tipos de movimiento rectilíneo</tspan></text><text x="1360" y="58" font-size="18" fill="#cfe0f3" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1360" dy="0.0">Física · II° medio · Cinemática</tspan></text><rect x="40" y="120" width="430" height="850" rx="14" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="64" y="168" font-size="34" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">MRU</tspan></text><text x="64" y="200" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Movimiento rectilíneo uniforme</tspan></text><text x="64" y="260" font-size="19" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Características</tspan></text><circle cx="72" cy="283" r="4" fill="#163a5f" stroke="none" stroke-width="2"/><text x="86" y="288" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="86" dy="0.0">Trayectoria rectilínea</tspan></text><circle cx="72" cy="313.0" r="4" fill="#163a5f" stroke="none" stroke-width="2"/><text x="86" y="318.0" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="86" dy="0.0">Velocidad constante</tspan></text><circle cx="72" cy="343.0" r="4" fill="#163a5f" stroke="none" stroke-width="2"/><text x="86" y="348.0" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="86" dy="0.0">Aceleración nula</tspan></text><circle cx="72" cy="373.0" r="4" fill="#163a5f" stroke="none" stroke-width="2"/><text x="86" y="378.0" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="86" dy="0.0">Distancias iguales en tiempos iguales</tspan></text><text x="64" y="450" font-size="19" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Ecuaciones</tspan></text><rect x="64" y="466" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="255" y="493" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="255" dy="0.0">v = Δx / Δt</tspan></text><rect x="64" y="516" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="255" y="543" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="255" dy="0.0">x = x₀ + v · t</tspan></text><rect x="64" y="566" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="255" y="593" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="255" dy="0.0">d = v · t</tspan></text><text x="64" y="700" font-size="19" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Gráficos</tspan></text><line x1="74" y1="850" x2="174" y2="850" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="74" y1="850" x2="74" y2="734" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="178" y="855" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="178" dy="0.0">t</tspan></text><text x="70" y="728" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="70" dy="0.0">x</tspan></text><line x1="74" y1="839.0" x2="164.0" y2="751.0" stroke="#163a5f" stroke-width="4" stroke-linecap="round"/><line x1="206" y1="850" x2="306" y2="850" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="206" y1="850" x2="206" y2="734" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="310" y="855" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="310" dy="0.0">t</tspan></text><text x="202" y="728" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="202" dy="0.0">v</tspan></text><line x1="206" y1="789.5" x2="296.0" y2="789.5" stroke="#163a5f" stroke-width="4" stroke-linecap="round"/><line x1="338" y1="850" x2="438" y2="850" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="338" y1="850" x2="338" y2="734" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="442" y="855" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="442" dy="0.0">t</tspan></text><text x="334" y="728" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="334" dy="0.0">a</tspan></text><line x1="338" y1="848" x2="428.0" y2="848" stroke="#163a5f" stroke-width="5" stroke-linecap="round"/><text x="64" y="905" font-size="14.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">pendiente de x-t = velocidad · pendiente de v-t =</tspan><tspan x="64" dy="18.9">aceleración · área bajo v-t = desplazamiento</tspan></text><rect x="490" y="120" width="430" height="850" rx="14" fill="#EFEDFB" stroke="none" stroke-width="1.5"/><text x="514" y="168" font-size="34" fill="#7F77DD" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">MRUA</tspan></text><text x="514" y="200" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">Movimiento rectilíneo uniformemente</tspan><tspan x="514" dy="20.8">acelerado</tspan></text><text x="514" y="260" font-size="19" fill="#7F77DD" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">Características</tspan></text><circle cx="522" cy="283" r="4" fill="#7F77DD" stroke="none" stroke-width="2"/><text x="536" y="288" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="536" dy="0.0">Trayectoria rectilínea</tspan></text><circle cx="522" cy="313.0" r="4" fill="#7F77DD" stroke="none" stroke-width="2"/><text x="536" y="318.0" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="536" dy="0.0">Aceleración constante</tspan></text><circle cx="522" cy="343.0" r="4" fill="#7F77DD" stroke="none" stroke-width="2"/><text x="536" y="348.0" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="536" dy="0.0">La velocidad cambia lo mismo en tiempos</tspan><tspan x="536" dy="20.8">iguales</tspan></text><circle cx="522" cy="393.8" r="4" fill="#7F77DD" stroke="none" stroke-width="2"/><text x="536" y="398.8" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="536" dy="0.0">Gráfico x-t: parábola</tspan></text><text x="514" y="450" font-size="19" fill="#7F77DD" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">Ecuaciones</tspan></text><rect x="514" y="466" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="705" y="493" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="705" dy="0.0">a = (v − v₀) / t</tspan></text><rect x="514" y="516" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="705" y="543" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="705" dy="0.0">v = v₀ + a · t</tspan></text><rect x="514" y="566" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="705" y="593" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="705" dy="0.0">x = x₀ + v₀ · t + ½ a · t²</tspan></text><rect x="514" y="616" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="705" y="643" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="705" dy="0.0">v² = v₀² + 2 a · Δx</tspan></text><text x="514" y="700" font-size="19" fill="#7F77DD" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">Gráficos</tspan></text><line x1="524" y1="850" x2="624" y2="850" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="524" y1="850" x2="524" y2="734" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="628" y="855" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="628" dy="0.0">t</tspan></text><text x="520" y="728" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="520" dy="0.0">x</tspan></text><path d="M524.000000,850.000000 Q584.000000,850.000000 614.000000,745.500000" stroke="#7F77DD" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="656" y1="850" x2="756" y2="850" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="656" y1="850" x2="656" y2="734" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="760" y="855" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="760" dy="0.0">t</tspan></text><text x="652" y="728" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="652" dy="0.0">v</tspan></text><line x1="656" y1="839.0" x2="746.0" y2="751.0" stroke="#7F77DD" stroke-width="4" stroke-linecap="round"/><line x1="788" y1="850" x2="888" y2="850" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="788" y1="850" x2="788" y2="734" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="892" y="855" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="892" dy="0.0">t</tspan></text><text x="784" y="728" font-size="15" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="784" dy="0.0">a</tspan></text><line x1="788" y1="789.5" x2="878.0" y2="789.5" stroke="#7F77DD" stroke-width="4" stroke-linecap="round"/><text x="514" y="905" font-size="14.5" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">pendiente de x-t = velocidad · pendiente de v-t =</tspan><tspan x="514" dy="18.9">aceleración · área bajo v-t = desplazamiento</tspan></text><rect x="940" y="120" width="430" height="850" rx="14" fill="#E8F6EF" stroke="none" stroke-width="1.5"/><text x="964" y="168" font-size="34" fill="#1D9E75" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Caída libre</tspan></text><text x="964" y="200" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">MRUA vertical con a = g (sin roce con el</tspan><tspan x="964" dy="20.8">aire)</tspan></text><text x="964" y="260" font-size="19" fill="#1D9E75" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Características</tspan></text><circle cx="972" cy="283" r="4" fill="#1D9E75" stroke="none" stroke-width="2"/><text x="986" y="288" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="986" dy="0.0">g ≈ 9,8 m/s², hacia abajo</tspan></text><circle cx="972" cy="313.0" r="4" fill="#1D9E75" stroke="none" stroke-width="2"/><text x="986" y="318.0" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="986" dy="0.0">Todos los cuerpos caen con la misma</tspan><tspan x="986" dy="20.8">aceleración</tspan></text><circle cx="972" cy="363.8" r="4" fill="#1D9E75" stroke="none" stroke-width="2"/><text x="986" y="368.8" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="986" dy="0.0">Si se suelta: v₀ = 0</tspan></text><circle cx="972" cy="393.8" r="4" fill="#1D9E75" stroke="none" stroke-width="2"/><text x="986" y="398.8" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="986" dy="0.0">En la altura máxima, v = 0</tspan></text><text x="964" y="450" font-size="19" fill="#1D9E75" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Ecuaciones</tspan></text><rect x="964" y="466" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="1155" y="493" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1155" dy="0.0">v = v₀ − g · t</tspan></text><rect x="964" y="516" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="1155" y="543" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1155" dy="0.0">y = y₀ + v₀ · t − ½ g · t²</tspan></text><rect x="964" y="566" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="1155" y="593" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1155" dy="0.0">v² = v₀² − 2 g · Δy</tspan></text><rect x="964" y="616" width="382" height="40" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="1155" y="643" font-size="19" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1155" dy="0.0">altura máx. = v₀² / 2g</tspan></text><text x="964" y="720" font-size="19" fill="#1D9E75" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Convención de signos</tspan></text><text x="964" y="752" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Si el eje y apunta hacia arriba, la</tspan><tspan x="964" dy="20.8">aceleración es −g: la velocidad es positiva</tspan><tspan x="964" dy="20.8">mientras el cuerpo sube y negativa mientras</tspan><tspan x="964" dy="20.8">baja.</tspan></text><text x="964" y="860" font-size="16" fill="#D85A30" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">En la altura máxima la velocidad es 0, pero</tspan><tspan x="964" dy="20.8">la aceleración sigue siendo g hacia abajo.</tspan></text><text x="1376" y="984" font-size="13" fill="#5b6675" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1376" dy="0.0">Órbita Matemática · Prof. Fernando J. Aravena Muñoz</tspan></text></svg>