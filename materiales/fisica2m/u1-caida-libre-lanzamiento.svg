<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" width="1400" height="930" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Caída libre y lanzamiento vertical</title><defs><marker id="ar16202b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202b"/></marker><marker id="ar5b6675" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1400" height="96" fill="#163a5f"/><text x="40" y="58" font-size="38" fill="#ffffff" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="40" dy="0.0">Caída libre y lanzamiento vertical</tspan></text><text x="1360" y="58" font-size="18" fill="#cfe0f3" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1360" dy="0.0">Física · II° medio · Cinemática</tspan></text><rect x="40" y="120" width="430" height="560" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="64" y="164" font-size="26" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Caída libre</tspan></text><line x1="80" y1="600" x2="340" y2="600" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="160" y1="600" x2="160" y2="210" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="168" y="212" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="168" dy="0.0">y</tspan></text><circle cx="160" cy="330.0" r="11" fill="#378ADD" fill-opacity="0.30"/><circle cx="160" cy="340.8" r="11" fill="#378ADD" fill-opacity="0.42"/><circle cx="160" cy="373.2" r="11" fill="#378ADD" fill-opacity="0.54"/><circle cx="160" cy="427.2" r="11" fill="#378ADD" fill-opacity="0.66"/><circle cx="160" cy="502.8" r="11" fill="#378ADD" fill-opacity="0.78"/><circle cx="160" cy="600.0" r="11" fill="#378ADD" fill-opacity="0.90"/><line x1="120" y1="330" x2="310" y2="330" stroke="#5b6675" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/><text x="316" y="324" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="316" dy="0.0">y₀ = H</tspan></text><text x="200" y="420" font-size="22" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="200" dy="0.0">v₀ = 0</tspan></text><text x="200" y="450" font-size="22" fill="#D85A30" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="200" dy="0.0">a = −g</tspan></text><text x="64" y="640" font-size="15.5" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Se suelta desde una altura H, sin velocidad</tspan><tspan x="64" dy="20.2">inicial.</tspan></text><rect x="490" y="120" width="430" height="560" rx="14" fill="#EFEDFB" stroke="none" stroke-width="1.5"/><text x="514" y="164" font-size="26" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">Lanzamiento hacia arriba</tspan></text><line x1="530" y1="600" x2="790" y2="600" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="610" y1="600" x2="610" y2="210" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="618" y="212" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="618" dy="0.0">y</tspan></text><circle cx="610" cy="600.0" r="11" fill="#378ADD" fill-opacity="0.30"/><circle cx="610" cy="474.0" r="11" fill="#378ADD" fill-opacity="0.42"/><circle cx="610" cy="376.0" r="11" fill="#378ADD" fill-opacity="0.54"/><circle cx="610" cy="306.0" r="11" fill="#378ADD" fill-opacity="0.66"/><circle cx="610" cy="264.0" r="11" fill="#378ADD" fill-opacity="0.78"/><circle cx="610" cy="250.0" r="11" fill="#378ADD" fill-opacity="0.90"/><text x="624" y="588" font-size="15" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="624" dy="0.0">parte desde el suelo (y₀ = 0)</tspan></text><text x="634" y="262" font-size="16" fill="#D85A30" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="634" dy="0.0">altura máxima: v = 0</tspan></text><text x="650" y="420" font-size="22" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="650" dy="0.0">v₀ &gt; 0</tspan></text><text x="650" y="450" font-size="22" fill="#D85A30" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="650" dy="0.0">a = −g</tspan></text><text x="514" y="640" font-size="15.5" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="514" dy="0.0">Se lanza hacia arriba: sube frenando, se</tspan><tspan x="514" dy="20.2">detiene en la altura máxima y vuelve a bajar.</tspan></text><rect x="940" y="120" width="430" height="560" rx="14" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="964" y="164" font-size="26" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Lanzamiento hacia abajo</tspan></text><line x1="980" y1="600" x2="1240" y2="600" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><line x1="1060" y1="600" x2="1060" y2="210" stroke="#16202b" stroke-width="2" marker-end="url(#ar16202b)" stroke-linecap="round"/><text x="1068" y="212" font-size="16" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1068" dy="0.0">y</tspan></text><circle cx="1060" cy="330.0" r="11" fill="#378ADD" fill-opacity="0.30"/><circle cx="1060" cy="360.2" r="11" fill="#378ADD" fill-opacity="0.42"/><circle cx="1060" cy="402.4" r="11" fill="#378ADD" fill-opacity="0.54"/><circle cx="1060" cy="456.4" r="11" fill="#378ADD" fill-opacity="0.66"/><circle cx="1060" cy="522.2" r="11" fill="#378ADD" fill-opacity="0.78"/><circle cx="1060" cy="600.0" r="11" fill="#378ADD" fill-opacity="0.90"/><line x1="1020" y1="330" x2="1210" y2="330" stroke="#5b6675" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/><text x="1216" y="324" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1216" dy="0.0">y₀ = H</tspan></text><text x="1100" y="420" font-size="22" fill="#16202b" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1100" dy="0.0">v₀ &lt; 0</tspan></text><text x="1100" y="450" font-size="22" fill="#D85A30" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1100" dy="0.0">a = −g</tspan></text><text x="964" y="640" font-size="15.5" fill="#16202b" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="964" dy="0.0">Se lanza hacia abajo: su rapidez aumenta desde</tspan><tspan x="964" dy="20.2">el inicio.</tspan></text><rect x="40" y="700" width="1320" height="190" rx="14" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/><text x="64" y="742" font-size="21" fill="#163a5f" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Ecuaciones (eje y hacia arriba, g ≈ 9,8 m/s²)</tspan></text><rect x="64" y="762" width="244" height="48" rx="8" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="186" y="793" font-size="16.5" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="186" dy="0.0">v = v₀ − g · t</tspan></text><rect x="322" y="762" width="244" height="48" rx="8" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="444" y="793" font-size="16.5" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="444" dy="0.0">y = y₀ + v₀ · t − ½ g · t²</tspan></text><rect x="580" y="762" width="244" height="48" rx="8" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="702" y="793" font-size="16.5" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="702" dy="0.0">v² = v₀² − 2 g · Δy</tspan></text><rect x="838" y="762" width="244" height="48" rx="8" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="960" y="793" font-size="16.5" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="960" dy="0.0">altura máx. = v₀² / 2g</tspan></text><rect x="1096" y="762" width="244" height="48" rx="8" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="1218" y="793" font-size="16.5" fill="#16202b" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="1218" dy="0.0">t de subida = v₀ / g</tspan></text><text x="64" y="848" font-size="16" fill="#5b6675" text-anchor="start" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="64" dy="0.0">Sin roce con el aire, un cuerpo lanzado hacia arriba tarda lo mismo en subir que en bajar y vuelve al punto de partida con la misma rapidez con que fue</tspan><tspan x="64" dy="20.8">lanzado.</tspan></text><text x="1376" y="914" font-size="13" fill="#5b6675" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1376" dy="0.0">Órbita Matemática · Prof. Fernando J. Aravena Muñoz</tspan></text></svg>