<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>El movimiento: mapa conceptual</title><defs><marker id="ar5b6675" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1400" height="96" fill="#163a5f"/><text x="40" y="58" font-size="38" fill="#ffffff" text-anchor="start" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="40" dy="0.0">El movimiento</tspan></text><text x="1360" y="58" font-size="18" fill="#cfe0f3" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1360" dy="0.0">Física · II° medio · Mapa conceptual</tspan></text><rect x="520" y="120" width="360" height="70" rx="12" fill="#163a5f" stroke="none" stroke-width="1.5"/><text x="700.0" y="162.0" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="700.0" dy="0.0">MOVIMIENTO</tspan></text><rect x="470" y="250" width="460" height="100" rx="12" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="700.0" y="284" font-size="21" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="700.0" dy="0.0">Cambio de posición</tspan></text><text x="700.0" y="310" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="700.0" dy="0.0">de un cuerpo respecto de un sistema de referencia</tspan></text><line x1="700" y1="190" x2="700" y2="250" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><text x="708.0" y="216.0" font-size="15" fill="#5b6675" text-anchor="start" font-weight="400" font-style="italic" xml:space="preserve"><tspan x="708.0" dy="0.0">es el</tspan></text><rect x="60" y="250" width="330" height="160" rx="12" fill="#FFF4E5" stroke="none" stroke-width="1.5"/><text x="225.0" y="284" font-size="21" fill="#D85A30" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="225.0" dy="0.0">Es relativo</tspan></text><text x="225.0" y="310" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="225.0" dy="0.0">Depende del observador: un pasajero</tspan><tspan x="225.0" dy="19.5">está en reposo respecto del bus, pero</tspan><tspan x="225.0" dy="19.5">en movimiento respecto de la calle.</tspan></text><line x1="470" y1="300" x2="392" y2="320" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><rect x="60" y="470" width="250" height="120" rx="12" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="185.0" y="504" font-size="20" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="185.0" dy="0.0">Trayectoria</tspan></text><text x="185.0" y="530" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="185.0" dy="0.0">camino recorrido:</tspan><tspan x="185.0" dy="19.5">rectilínea o curvilínea</tspan></text><rect x="330" y="470" width="250" height="120" rx="12" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="455.0" y="504" font-size="20" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="455.0" dy="0.0">Distancia recorrida</tspan></text><text x="455.0" y="530" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="455.0" dy="0.0">largo del camino (escalar)</tspan></text><rect x="600" y="470" width="250" height="120" rx="12" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="725.0" y="504" font-size="20" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="725.0" dy="0.0">Desplazamiento</tspan></text><text x="725.0" y="530" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="725.0" dy="0.0">del inicio al final</tspan><tspan x="725.0" dy="19.5">(vector)</tspan></text><rect x="870" y="470" width="230" height="120" rx="12" fill="#EAF2FB" stroke="none" stroke-width="1.5"/><text x="985.0" y="504" font-size="20" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="985.0" dy="0.0">Tiempo</tspan></text><text x="985.0" y="530" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="985.0" dy="0.0">intervalo Δt</tspan></text><line x1="700" y1="350" x2="185" y2="470" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><line x1="700" y1="350" x2="455" y2="470" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><line x1="700" y1="350" x2="725" y2="470" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><line x1="700" y1="350" x2="985" y2="470" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><text x="860" y="395" font-size="15" fill="#5b6675" text-anchor="start" font-weight="400" font-style="italic" xml:space="preserve"><tspan x="860" dy="0.0">se describe con</tspan></text><rect x="250" y="650" width="360" height="110" rx="12" fill="#E8F6EF" stroke="none" stroke-width="1.5"/><text x="430.0" y="684" font-size="21" fill="#1D9E75" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="430.0" dy="0.0">Rapidez = d / t</tspan></text><text x="430.0" y="710" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="430.0" dy="0.0">escalar, siempre positiva</tspan></text><rect x="650" y="650" width="400" height="110" rx="12" fill="#E8F6EF" stroke="none" stroke-width="1.5"/><text x="850.0" y="684" font-size="21" fill="#1D9E75" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="850.0" dy="0.0">Velocidad = Δx / Δt</tspan></text><text x="850.0" y="710" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="850.0" dy="0.0">vector: tiene sentido (signo)</tspan></text><line x1="455" y1="590" x2="430" y2="650" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><line x1="725" y1="590" x2="850" y2="650" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><line x1="985" y1="590" x2="900" y2="650" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><rect x="170" y="820" width="420" height="110" rx="12" fill="#DCEBFA" stroke="none" stroke-width="1.5"/><text x="380.0" y="854" font-size="21" fill="#163a5f" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="380.0" dy="0.0">Velocidad constante</tspan></text><text x="380.0" y="880" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="380.0" dy="0.0">→ MRU: aceleración nula</tspan></text><rect x="650" y="820" width="680" height="110" rx="12" fill="#EFEDFB" stroke="none" stroke-width="1.5"/><text x="990.0" y="854" font-size="21" fill="#7F77DD" text-anchor="middle" font-weight="700" font-style="normal" xml:space="preserve"><tspan x="990.0" dy="0.0">Velocidad variable → aceleración</tspan></text><text x="990.0" y="880" font-size="15" fill="#16202b" text-anchor="middle" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="990.0" dy="0.0">Si la aceleración es constante → MRUA. Casos: caída libre y lanzamiento vertical</tspan><tspan x="990.0" dy="19.5">(a = g).</tspan></text><line x1="850" y1="760" x2="380" y2="820" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><line x1="850" y1="760" x2="990" y2="820" stroke="#5b6675" stroke-width="2" marker-end="url(#ar5b6675)" stroke-linecap="round"/><text x="720" y="800" font-size="15" fill="#5b6675" text-anchor="middle" font-weight="400" font-style="italic" xml:space="preserve"><tspan x="720" dy="0.0">puede ser</tspan></text><text x="1376" y="964" font-size="13" fill="#5b6675" text-anchor="end" font-weight="400" font-style="normal" xml:space="preserve"><tspan x="1376" dy="0.0">Órbita Matemática · Prof. Fernando J. Aravena Muñoz</tspan></text></svg>