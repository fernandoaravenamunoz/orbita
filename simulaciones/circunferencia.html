<style>

:root{color-scheme:light;--bg:#ffffff;--ink:#16202b;--mut:#5b6675;--line:#dde4ec;--grid:#edf1f6;--band:#163a5f;--card:#f2f6fb;--sel:#378ADD;--coral:#D85A30;--teal:#1D9E75;--vio:#7F77DD;--amb:#BA7517;--pink:#D4537E}

button,input{font:inherit;color:inherit}
button{min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
button:hover{border-color:var(--mut)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
button.on{border-color:var(--sel);color:var(--sel);background:color-mix(in srgb,var(--sel) 10%,transparent)}

input[type=checkbox]{accent-color:var(--sel);width:18px;height:18px}
.top{background:#EAF2FB;color:#163a5f;border-bottom:3px solid #378ADD;padding:14px max(4vw,16px);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;flex-wrap:wrap}

select{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:4px 10px;font:inherit;font-size:15px;color:inherit}

<script>
{
const $=id=>document.getElementById(id);
const nf=(x,d=2)=>{const r=Math.round(x*10**d)/10**d;return(Object.is(r,-0)?0:r).toLocaleString('es-CL',{maximumFractionDigits:d});};
const F1=v=>(+v).toFixed(1);
const C={ink:'#16202b',mut:'#5b6675',line:'#dde4ec',teal:'#1D9E75',coral:'#D85A30',vio:'#7F77DD',amb:'#BA7517',sel:'#378ADD',pink:'#D4537E'};
const R=5;// radio en cm
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const pc=t=>[R*Math.cos(rad(t)),R*Math.sin(rad(t))];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],len=a=>Math.hypot(a[0],a[1]),dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const norm=t=>((t%360)+360)%360,ccw=(a,b)=>norm(b-a);// arco antihorario de a a b
const angAt=(V,X,Y)=>{const a=sub(X,V),b=sub(Y,V);return deg(Math.acos(Math.max(-1,Math.min(1,dot(a,b)/(len(a)*len(b))))));};
const tOf=p=>norm(deg(Math.atan2(p[1],p[0])));
function arcNot(t1,t2,tz){const a=ccw(t1,t2),z=ccw(t1,tz);return z>0&&z<a?{from:t2,m:360-a}:{from:t1,m:a};}// arco de t1 a t2 que no contiene tz
function lineCircle(P,u){const b=dot(P,u),c=dot(P,P)-R*R,D=b*b-c;if(D<0)return null;const s1=-b-Math.sqrt(D),s2=-b+Math.sqrt(D);return[add(P,mul(u,s1)),add(P,mul(u,s2)),s1,s2];}
/* ---------- teoremas ---------- */
const TH={
 ang:{
  inscrito:{n:'Ángulo inscrito y ángulo del centro',st:{A:200,B:330,P:90},stmt:'Un <b>ángulo inscrito</b> mide la <b>mitad</b> del ángulo del centro que subtiende el mismo arco.',f:'∠APB = ∠AOB : 2'},
  mismo:{n:'Inscritos en el mismo arco',st:{A:210,B:330,P:70,Q:130},stmt:'Los ángulos inscritos que subtienden el <b>mismo arco</b> son <b>iguales</b>.',f:'∠APB = ∠AQB'},
  semi:{n:'Inscrito en una semicircunferencia',st:{A:180,P:60},stmt:'Todo ángulo inscrito en una <b>semicircunferencia</b> es <b>recto</b> (teorema de Tales).',f:'∠APB = 90°'},
  cuadri:{n:'Cuadrilátero inscrito',st:{A:200,B:290,C:20,D:120},stmt:'En un cuadrilátero inscrito, los ángulos <b>opuestos</b> son <b>suplementarios</b>: suman 180°.',f:'∠A + ∠C = ∠B + ∠D = 180°'},
  semiins:{n:'Ángulo semiinscrito',st:{A:250,B:30},stmt:'El ángulo entre una <b>tangente</b> y una <b>cuerda</b> (semiinscrito) mide la <b>mitad del arco</b> que abarca.',f:'∠(t, AB) = arco AB : 2'},
  interior:{n:'Ángulo interior',st:{A:150,B:300,C:220,D:50},stmt:'El ángulo formado por dos <b>cuerdas que se cortan</b> mide la <b>semisuma</b> de los arcos que abarcan él y su opuesto por el vértice.',f:'∠APC = (arco AC + arco BD) : 2'},
  exterior:{n:'Ángulo exterior',st:{P:[-9,1.5],B:30,D:-40},stmt:'El ángulo formado por dos <b>secantes</b> desde un punto exterior mide la <b>semidiferencia</b> de los arcos que abarca.',f:'∠P = (arco BD − arco AC) : 2'}},
 seg:{
  cuerdas:{n:'Teorema de las cuerdas',st:{A:160,B:310,C:226,D:40},stmt:'Si dos cuerdas se cortan en P, el <b>producto de los segmentos</b> de una es igual al de la otra.',f:'PA · PB = PC · PD'},
  secantes:{n:'Teorema de las secantes',st:{P:[-9.5,1],B:20,D:-35},stmt:'Si desde un punto exterior P se trazan dos secantes, el producto de cada secante entera por su segmento exterior es el mismo.',f:'PA · PB = PC · PD'},
  tansec:{n:'Tangente y secante',st:{P:[-9,2],B:-20},stmt:'Si desde P se trazan una tangente y una secante, el <b>cuadrado de la tangente</b> es igual al producto de la secante entera por su segmento exterior.',f:'PT² = PA · PB'},
  tangentes:{n:'Tangentes desde un punto exterior',st:{P:[-9,1]},stmt:'Las dos <b>tangentes</b> trazadas desde un punto exterior tienen la <b>misma medida</b>, y son perpendiculares al radio en el punto de tangencia.',f:'PT₁ = PT₂'},
  perp:{n:'Radio perpendicular a una cuerda',st:{A:200,B:340},stmt:'El radio perpendicular a una cuerda la <b>dimidia</b> (la corta en dos partes iguales). Con Pitágoras: OM² + AM² = r².',f:'AM = MB · OM² + AM² = r²'}}};
const S={tab:'ang',th:{ang:'inscrito',seg:'cuerdas'},st:{},drag:null,prob:null,pcat:'todos'};
function st(){const k=S.th[S.tab];if(!S.st[k])S.st[k]=JSON.parse(JSON.stringify(TH[S.tab][k].st));return S.st[k];}
/* ---------- dibujo ---------- */
let V={};let LBL=null;
const Sx=p=>[V.cx+p[0]*V.k,V.cy-p[1]*V.k];
const Ln=(a,b,c,w,o={})=>{const A=Sx(a),B=Sx(b);return `<line x1="${F1(A[0])}" y1="${F1(A[1])}" x2="${F1(B[0])}" y2="${F1(B[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;};
const Tx=(p,t,c,o={})=>{const q=Sx(p);return `<text x="${F1(q[0]+(o.dx||0))}" y="${F1(q[1]+(o.dy||0))}" font-size="${o.fs||15}" font-weight="${o.fw||600}" fill="${c}" text-anchor="${o.a||'middle'}" dominant-baseline="central" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</text>`;};
function arcPath(t0,m,r=R){const n=Math.max(8,Math.ceil(m/4));let d='';for(let i=0;i<=n;i++){const t=rad(t0+m*i/n),q=Sx([r*Math.cos(t),r*Math.sin(t)]);d+=(i?'L':'M')+F1(q[0])+' '+F1(q[1]);}return d;}
const arcSv=(t0,m,c,w=6)=>`<path d="${arcPath(t0,m)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity=".85"/>`;
function angMark(Vp,X,Y,c,lab,r=0.9){const a1=deg(Math.atan2(X[1]-Vp[1],X[0]-Vp[0])),a2=deg(Math.atan2(Y[1]-Vp[1],Y[0]-Vp[0]));let d=ccw(a1,a2),s=a1;if(d>180){s=a2;d=360-d;}const n=16;let p=`M${F1(Sx(Vp)[0])} ${F1(Sx(Vp)[1])}`;for(let i=0;i<=n;i++){const t=rad(s+d*i/n);const q=Sx(add(Vp,[r*Math.cos(t),r*Math.sin(t)]));p+=`L${F1(q[0])} ${F1(q[1])}`;}
 const mid=rad(s+d/2),lp=add(Vp,[(r+0.85)*Math.cos(mid),(r+0.85)*Math.sin(mid)]);return `<path d="${p} Z" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="2"/>`+(lab?Tx(lp,lab,c,{fs:14}):'');}
const rightMark=(Vp,X,Y,c)=>{const u=mul(sub(X,Vp),0.55/len(sub(X,Vp))),v=mul(sub(Y,Vp),0.55/len(sub(Y,Vp))),a=Sx(add(Vp,u)),b=Sx(add(add(Vp,u),v)),d=Sx(add(Vp,v));return `<polyline points="${F1(a[0])},${F1(a[1])} ${F1(b[0])},${F1(b[1])} ${F1(d[0])},${F1(d[1])}" fill="none" stroke="${c}" stroke-width="1.8"/>`;};
function pt(p,name,h,col=C.ink,lo=[0,0]){if(LBL)h=null;const q=Sx(p),c=len(p)>0.1?mul(p,1/len(p)):[0,1];const lp=add(p,add(mul(c,0.75),lo));let o=`<circle cx="${F1(q[0])}" cy="${F1(q[1])}" r="${h?8:5}" fill="${h?'#fff':col}" stroke="${col}" stroke-width="${h?2.6:0}"/>`+Tx(lp,name,col,{fs:16});if(h&&!LBL)o+=`<circle cx="${F1(q[0])}" cy="${F1(q[1])}" r="18" fill="transparent" data-h="${h}" style="cursor:grab"/>`;return o;}
const L=(id,v)=>LBL?(LBL[id]??null):v;// texto del valor (o rótulo del problema)
function segLab(a,b,id,v,c,side=1){const t=L(id,v);if(t===null)return'';const m=mul(add(a,b),.5),d=sub(b,a),n=mul([-d[1],d[0]],side*0.55/len(d));return Tx(add(m,n),t,c,{fs:14});}
function draw(key,s){let o='';const info={};const O=[0,0];
 o+=`<circle cx="${F1(V.cx)}" cy="${F1(V.cy)}" r="${F1(R*V.k)}" fill="#f8fbff" stroke="${C.ink}" stroke-width="2.2"/>`+`<circle cx="${F1(V.cx)}" cy="${F1(V.cy)}" r="3.5" fill="${C.ink}"/>`;
 const oLab=(p=[0,-0.55])=>Tx(p,'O',C.ink,{fs:14});
 if(key==='inscrito'){const A=pc(s.A),B=pc(s.B),P=pc(s.P),ar=arcNot(s.A,s.B,s.P),ins=angAt(P,A,B),cen=ar.m;info.v=[['Arco AB',`${nf(cen,1)}°`],['∠AOB (del centro)',`${nf(cen,1)}°`],['∠APB (inscrito)',`${nf(ins,1)}°`]];info.chk=`∠APB = ${nf(ins,1)}° = ${nf(cen,1)}° : 2`;

/* ---------- render y panel ---------- */
function render(){const sv=$('csv'),W=sv.clientWidth||700,H=sv.clientHeight||520;sv.setAttribute('viewBox',`0 0 ${W} ${H}`);
 let key,s;if(S.tab==='prob'){if(!S.prob)return;key=S.prob.key;s=S.prob.st;LBL=S.prob.lab;if(S.prob.key==='perp'){LBL=Object.assign({},LBL);}}else{key=S.th[S.tab];s=st();LBL=null;}
 const ext=['exterior','secantes','tansec','tangentes'].includes(key);V={k:Math.min(W/(ext?19.5:2*R+3.4),H/(2*R+3.4)),cx:0,cy:H/2};V.cx=ext?W/2+V.k*2.85:W/2;
 const{o,info}=draw(key,s);let extra='';if(S.tab==='prob'&&key==='perp'){const A=pc(s.A),B=pc(s.B);extra=Tx(add(mul(add(A,B),.5),[0,-0.9]),'AB = x',C.sel,{fs:15});}
 sv.innerHTML=o+extra+(S.tab==='prob'?`<text x="12" y="${H-12}" font-size="12" fill="${C.mut}">Figura referencial: no está a escala</text>`:'');return info;}
function upd(){document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.r===S.tab));
 const pr=S.tab==='prob';$('thBox').hidden=pr;$('valBox').hidden=pr;$('pBox').hidden=!pr;$('stmtBox').hidden=pr;
 if(!pr){const set=TH[S.tab];$('thSel').innerHTML=Object.keys(set).map(k=>`<button data-k="${k}" class="${k===S.th[S.tab]?'on':''}">${set[k].n}</button>`).join('');const t=set[S.th[S.tab]];
  $('title').textContent=t.n;$('stmt').innerHTML=t.stmt;$('form').textContent=t.f;$('hint').textContent='Arrastra los puntos blancos: los que están sobre la circunferencia se mueven por ella'+(['exterior','secantes','tansec','tangentes'].includes(S.th[S.tab])?'; P se mueve por fuera':'');
  const info=render();$('vals').innerHTML=(info.v||[]).map(([l,v])=>`<div class="met"><p class="l">${l}</p><p class="v">${v}</p></div>`).join('');$('chk').innerHTML=info.chk||'';}
 else{$('title').textContent='Problemas: encuentra x';$('hint').textContent='';document.querySelectorAll('#pcat button').forEach(b=>b.classList.toggle('on',b.dataset.c===S.pcat));if(!S.prob){newProb();return;}
  $('pq').innerHTML=S.prob.t.replace(/\([^)]*\)°/g,m=>`<span style="white-space:nowrap">${m}</span>`);$('psol').innerHTML=S.prob.solved?`<div class="fm">${S.prob.sol.map(x=>`<div>${x}</div>`).join('')}</div>`:'';render();}}
/* ---------- interacción ---------- */
const sv=$('csv');
sv.addEventListener('pointerdown',e=>{const h=e.target.getAttribute&&e.target.getAttribute('data-h');if(!h)return;S.drag=h;sv.setPointerCapture(e.pointerId);e.preventDefault();});
sv.addEventListener('pointermove',e=>{if(!S.drag)return;const r=sv.getBoundingClientRect(),w=[(e.clientX-r.left-V.cx)/V.k,-(e.clientY-r.top-V.cy)/V.k],s=st();
 if(S.drag==='P'&&Array.isArray(s.P)){let d=len(w);const mn=R*1.12,mx=R*2.3;const p=mul(w,Math.max(mn,Math.min(mx,d))/(d||1));s.P=[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10];}
 else s[S.drag]=Math.round(norm(deg(Math.atan2(w[1],w[0])))/2)*2;upd();});
const up=()=>{S.drag=null;};sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
$('thSel').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.th[S.tab]=b.dataset.k;upd();};
$('bReset').onclick=()=>{delete S.st[S.th[S.tab]];upd();};
$('pcat').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.pcat=b.dataset.c;newProb();};
$('bNew').onclick=newProb;$('bSol').onclick=()=>{S.prob.solved=true;upd();};
$('bChk').onclick=()=>{const v=parseFloat(($('xIn').value||'').replace(',','.'));if(isNaN(v)){$('xFb').innerHTML='<span class="no">Escribe un número.</span>';return;}const ok=Math.abs(v-S.prob.x)<0.01;$('xFb').innerHTML=ok?`<span class="ok">¡Correcto! x = ${nf(S.prob.x)}${S.prob.u}</span>`:`<span class="no">No es ${nf(v)}. Revisa el teorema e inténtalo de nuevo.</span>`;if(ok){S.prob.solved=true;upd();}};
function route(){const h=(location.hash||'').slice(1);S.tab=h==='segmentos'?'seg':h==='problemas'?'prob':'ang';upd();}
window.addEventListener('hashchange',route);new ResizeObserver(()=>render()).observe(document.body);route();
}

</script>
<style>

.mclase[aria-pressed="true"]{background:#163a5f;color:#fff;border-color:#163a5f}
@media(min-width:901px){
body.clase .concept,body.clase .note,body.clase .hint,body.clase .panel details,body.clase .panel .box:has(> details:only-child){display:none!important}
body.clase .work{grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr)}
body.clase .fig{height:clamp(420px,76vh,920px)}
body.clase .stepTxt{font-size:19px}}
@media(max-width:900px){.mclase{display:none}}
</style>
<script>
(function(){var K='orbita-modo-clase',on=false;try{on=localStorage.getItem(K)==='1';}catch(e){}
var b=document.createElement('button');b.type='button';b.className='mclase';b.textContent='Modo clase';b.title='Oculta las explicaciones y agranda la figura para proyectar';
function set(v){on=v;document.body.classList.toggle('clase',on);b.setAttribute('aria-pressed',on?'true':'false');try{localStorage.setItem(K,on?'1':'0');}catch(e){}setTimeout(function(){window.dispatchEvent(new Event('resize'));},30);}
b.onclick=function(){set(!on);};var h=document.querySelector('.brand')||document.querySelector('header');if(h)h.appendChild(b);set(on);})();
</script>
